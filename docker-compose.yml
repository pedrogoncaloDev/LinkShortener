services:
  db:
    image: postgres:16-alpine
    container_name: linkshortener-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: link_shortener
    ports:
      # 5434 no host para não colidir com um Postgres local já instalado na 5432/5433
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./back_end
    container_name: linkshortener-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8000:8000"
    volumes:
      - ./back_end:/app
      - ./back_end/database.docker.ini:/app/database.ini:ro

  frontend:
    build: ./front_end
    container_name: linkshortener-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:8080"
    volumes:
      - ./front_end:/app
      - /app/node_modules

volumes:
  db_data:
