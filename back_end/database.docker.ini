; Usado automaticamente pelo docker-compose dentro da rede dos containers
; (host = db, o nome do serviço do Postgres). Não é secreto: são credenciais
; de dev locais, isoladas em um volume Docker.

[postgres]
host = db
port = 5432
dbname = postgres
user = postgres
password = postgres

[link_shortener]
host = db
port = 5432
dbname = link_shortener
user = postgres
password = postgres
