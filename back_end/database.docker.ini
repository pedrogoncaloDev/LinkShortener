; Usado automaticamente pelo docker-compose dentro da rede dos containers
; (host = db, o nome do serviço do Postgres). Não é secreto: são credenciais
; de dev locais, isoladas em um volume Docker. O banco 'link_shortener' é
; criado pelo próprio Postgres via POSTGRES_DB no docker-compose.yml.

[link_shortener]
host = db
port = 5432
dbname = link_shortener
user = postgres
password = postgres
