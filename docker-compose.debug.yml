# Sempre combine com o arquivo base:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up
# Rodar este arquivo sozinho falha (backend não tem build/image aqui).
services:
  backend:
    command: sh -c "alembic upgrade head && python -X frozen_modules=off debug_entrypoint.py"
    ports:
      - "8000:8000"
      - "5678:5678"
    environment:
      DEBUG_WAIT_FOR_CLIENT: "false"
